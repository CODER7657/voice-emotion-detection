name: deploy-api

# Deploys api/index.py to Vercel (Python runtime) with the model-v1 release asset, and the
# site (web/dist) from the same origin.
#
# Needs repository secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID.
# Without VERCEL_TOKEN (forks, a repo not yet linked to Vercel) the job skips
# the deploy with a notice instead of failing.
# Optional repository variables:
#   LIVE_API_URL     production URL to health-check, e.g. https://<project>.vercel.app
#                    (default: the production alias parsed from the deploy output,
#                    else the per-deployment URL; a 401/403 from Deployment
#                    Protection is reported as a warning, not a failure)
#   ALLOWED_ORIGINS  extra https origins allowed by CORS (the site itself is served from
#                    the same origin, from web/dist, so it needs none)

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "src/vemo/**"
      - "models/head.json"
      - "scripts/build_vercel_bundle.py"
      - "scripts/vercel_fetch_model.py"
      - "scripts/check_deployment.py"
      - ".github/workflows/deploy.yml"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  MODEL_TAG: model-v1
  MODEL_FILE: wavlm_pooled_fp16w.onnx
  VERCEL_CLI_VERSION: 65.12.1

jobs:
  test:
    # Never deploy a commit whose tests fail (tests.yml runs the same suite, but
    # in parallel, so it cannot gate this workflow).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  web-test:
    # The site ships in the same deploy: never ship one that fails its checks.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run lint && npm run typecheck && npm test && npm run build

  deploy:
    needs: [test, web-test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check for Vercel credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice title=deploy skipped::VERCEL_TOKEN is not set (fork or repo not linked to Vercel); nothing deployed."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.creds.outputs.enabled == 'true'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.creds.outputs.enabled == 'true'
        with:
          python-version: "3.12"

      - name: Download and verify the model release asset
        if: steps.creds.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          cd release || exit 1
          gh release download "$MODEL_TAG" -R "$GITHUB_REPOSITORY" -p "$MODEL_FILE" -p SHA256SUMS
          sha256sum -c SHA256SUMS
          echo "MODEL_SHA256=$(awk -v f="$MODEL_FILE" '$2 == f || $2 == "*" f {print $1}' SHA256SUMS)" >> "$GITHUB_ENV"

      - name: Install the function's runtime requirements
        if: steps.creds.outputs.enabled == 'true'
        run: pip install -r api/requirements.txt httpx

      - name: Build the site
        if: steps.creds.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - if: steps.creds.outputs.enabled == 'true'
        working-directory: web
        run: npm ci && npm run build

      - name: Build the deploy bundle
        if: steps.creds.outputs.enabled == 'true'
        # Hobby caps CLI uploads at 100 MB, so the 190 MB model is fetched (and its
        # sha256 checked) by the bundle's build step on Vercel instead of uploaded.
        run: |
          test ${#MODEL_SHA256} -eq 64
          python scripts/build_vercel_bundle.py \
            --model "release/$MODEL_FILE" --sha256 "$MODEL_SHA256" \
            --fetch-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$MODEL_TAG/$MODEL_FILE" \
            --web-dist web/dist --out .vercel-bundle --measure-deps

      - name: Smoke-test the bundled app with the real model
        if: steps.creds.outputs.enabled == 'true'
        working-directory: .vercel-bundle
        run: |
          mkdir -p ../smoke-models
          cp models/head.json ../smoke-models/
          cp "../release/$MODEL_FILE" ../smoke-models/
          VEMO_MODEL_DIR=../smoke-models python - <<'PY'
          import importlib.util, sys
          import numpy as np
          spec = importlib.util.spec_from_file_location("idx", "api/index.py")
          m = importlib.util.module_from_spec(spec); sys.modules["idx"] = m; spec.loader.exec_module(m)
          from fastapi.testclient import TestClient
          c = TestClient(m.app)
          r = c.get("/ready"); print(r.status_code, r.text); assert r.status_code == 200
          t = np.arange(48000) / 16000
          # Voice-like (five harmonics): a single sine is refused as a tone.
          wave = (0.15 * sum(np.sin(2 * np.pi * 220 * k * t) / k for k in range(1, 6))).astype("<f4").tobytes()
          r = c.post("/predict", content=wave, headers={"Content-Type": "application/octet-stream"})
          print(r.status_code, r.text); assert r.status_code == 200
          PY

      - name: Deploy to Vercel (production)
        if: steps.creds.outputs.enabled == 'true'
        id: deploy
        working-directory: .vercel-bundle
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
        run: |
          npm i -g "vercel@$VERCEL_CLI_VERSION"
          # stdout is the deployment URL; stderr (kept in the log) has "Aliased: <production URL>"
          vercel deploy --prod --yes --token "$VERCEL_TOKEN" \
            --env MODEL_SHA256="$MODEL_SHA256" \
            --env ALLOWED_ORIGINS="$ALLOWED_ORIGINS" > ../vercel-deploy.out 2> ../vercel-deploy.log \
            || { cat ../vercel-deploy.log; exit 1; }
          cat ../vercel-deploy.log
          url=$(tail -n 1 ../vercel-deploy.out)
          echo "deployed: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Health-check the deployment
        if: steps.creds.outputs.enabled == 'true'
        env:
          LIVE_API_URL: ${{ vars.LIVE_API_URL }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        # /health then /ready, up to ~2 min each. Fails on 5xx or timeout only;
        # 401/403 (Deployment Protection) is a warning.
        run: |
          python scripts/check_deployment.py --url "$LIVE_API_URL" \
            --deploy-log vercel-deploy.log --deploy-url "$DEPLOY_URL"
