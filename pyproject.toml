[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vemo"
version = "0.2.0"
description = "Speech emotion recognition on RAVDESS with speaker-independent evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "librosa>=0.10",
  "soundfile>=0.12",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
cnn = ["tensorflow>=2.15"]
ssl = ["torch>=2.1", "transformers>=4.40"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
